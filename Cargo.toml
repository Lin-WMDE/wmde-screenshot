[package]
name = "wmde-screenshot"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
futures = "0.3"
image = "0.25"
jiff = "0.2"
log-panics = { version = "2.1.0", features = ["with-backtrace"] }
memmap2 = "0.9.10"
notify-rust = "4"
png = "0.18"
rustix = { version = "1.1", features = ["fs", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.27.0"
# Draws the annotations into the saved image. Same version and feature set the toolkit's
# software renderer uses, so the file and the preview come out of the same rasteriser.
# Glyphs for the text tool, baked into the saved image. Reached through the toolkit's own
# global font system, so the file uses the same fonts the preview did.
cosmic-text = "0.19"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
tokio = { version = "1.52.1", features = ["macros", "net", "rt", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.15.0", default-features = false, features = ["tokio"] }

# Capture. Same pinned revision as wmde-portal: the two talk to the same compositor
# protocols, and a split between them would be a bug that only shows at run time.
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", rev = "c0cff4d" }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", rev = "c0cff4d" }
wayland-client = "0.31.14"
wayland-protocols = "0.32.12"
# Runtime-agnostic timer for the capture timeouts: the same code has to work under tokio
# and under a plain block_on.
async-io = "2"

# Interface text. Ukrainian and English only - the stack has no Russian locale, and the
# build gate in build-packages.sh fails if an i18n/ru* directory appears.
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.11.0"

cosmic-config = { git = "https://github.com/pop-os/libcosmic" }
# The overlay draws each output's wallpaper behind the frames, so it reads the same state
# the wmde-bg daemon writes. Renamed crate, hence the explicit package name.
cosmic-bg-config = { package = "wmde-bg-config", path = "../wmde-bg/config" }

# The window-less daemon shape, layer surfaces and the theme all come from here. Feature
# set follows wmde-portal: the same runtime, the same renderer selection.
[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = [
    "autosize",
    "dbus-config",
    "desktop",
    "multi-window",
    "tokio",
    "wayland",
    "wgpu",
    "winit",
    # The save dialog. Without it `cosmic::dialog` does not exist at all: the module is
    # behind a cfg alias that this feature sets.
    "xdg-portal",
]

# Build libcosmic and iced from the local WMDE fork, so the rebranded config root and the
# fun.wmde.* theme ids resolve. ONE table per canonical git source: cargo folds the
# `.../libcosmic`, `.../libcosmic/` and `.../libcosmic.git` spellings into a single source,
# and a second table for it does not add to this one - part of the graph would silently
# resolve to upstream with no warning and no error.
[patch."https://github.com/pop-os/libcosmic"]
libcosmic = { path = "../libcosmic" }
cosmic-config = { path = "../libcosmic/cosmic-config" }
cosmic-config-derive = { path = "../libcosmic/cosmic-config-derive" }
cosmic-theme = { path = "../libcosmic/cosmic-theme" }
iced = { path = "../libcosmic/iced" }
iced_accessibility = { path = "../libcosmic/iced/accessibility" }
iced_core = { path = "../libcosmic/iced/core" }
iced_debug = { path = "../libcosmic/iced/debug" }
iced_futures = { path = "../libcosmic/iced/futures" }
iced_graphics = { path = "../libcosmic/iced/graphics" }
iced_program = { path = "../libcosmic/iced/program" }
iced_renderer = { path = "../libcosmic/iced/renderer" }
iced_runtime = { path = "../libcosmic/iced/runtime" }
iced_tiny_skia = { path = "../libcosmic/iced/tiny_skia" }
iced_wgpu = { path = "../libcosmic/iced/wgpu" }
iced_widget = { path = "../libcosmic/iced/widget" }
iced_winit = { path = "../libcosmic/iced/winit" }

# WMDE: shared release profile, see .doc/perf.
#  - panic = "abort" drops .eh_frame and .gcc_except_table; catch_unwind stops catching,
#    which in this stack only guards SVG parsing in iced's vector backends.
#  - lto = "fat" with one codegen unit removes what monomorphisation duplicated.
# The LTO half is expensive and single threaded; FAST=1 turns it off for development
# builds without touching panic or opt-level, so behaviour still matches what ships.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
